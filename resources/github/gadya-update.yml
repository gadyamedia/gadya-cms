# gadya-update-template: 4
#
# Updates the Gadya packages and puts the result in git.
#
# Run from the Gadya Media portal (a rollout, or the site's Update button),
# or by hand under the Actions tab. When the tests pass and the new version
# is within `merge`, the update goes straight to the branch it ran on;
# anything else waits in a pull request for a person.
#
# The first line is the template's number: the portal compares it with the
# one gadya/cms ships and offers to refresh this file. Change anything below
# it you need to; a refresh replaces the whole file.
name: Gadya update
run-name: Gadya update ${{ inputs.rollout_id }}

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to update, space separated
        type: string
        default: gadya/cms gadya/connect
      constraint:
        description: Version constraint for the first package, e.g. ^0.15 (blank keeps composer.json as it is)
        type: string
        default: ''
      merge:
        description: 'When the tests pass, push straight in for: patch (same minor), minor (same major; any 0.x), never (always a pull request)'
        type: choice
        options:
          - patch
          - minor
          - never
        default: patch
      rollout_id:
        description: The portal's rollout, so it can find this run (blank for a run by hand)
        type: string
        default: ''
      always_pull_request:
        description: Open a pull request even for a patch release (older portals; the same as merge = never)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gadya-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    # Inputs reach the scripts as environment variables, never pasted into them.
    env:
      PACKAGES: ${{ inputs.packages }}
      CONSTRAINT: ${{ inputs.constraint }}
      MERGE: ${{ inputs.merge }}
      ROLLOUT_ID: ${{ inputs.rollout_id }}
      ALWAYS_PULL_REQUEST: ${{ inputs.always_pull_request }}
      BRANCH: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      # The lock can need more than composer.json says: one resolved on a
      # newer PHP pulls packages (Symfony 8.1 wants 8.4) that an older PHP
      # refuses to install. So the higher of the two is used.
      - name: Read the PHP version this site needs
        id: php
        run: |
          required=$(jq -r '.require.php // "8.3"' composer.json | grep -oE '[0-9]+\.[0-9]+' | head -1)
          # Each package's lowest allowed version is its minimum ("8.1 - 8.5"
          # and "^8.2|^8.3" both mean 8.1 or 8.2 will do); the site needs the
          # highest of those minimums.
          locked=$(jq -r '(.packages + (."packages-dev" // []))[].require.php // empty' composer.lock 2>/dev/null | while read -r constraint; do echo "$constraint" | grep -oE '[0-9]+\.[0-9]+' | sort -V | head -1; done | sort -V | tail -1)
          echo "version=$(printf '%s\n%s\n' "$required" "$locked" | sort -V | tail -1)" >> "$GITHUB_OUTPUT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php.outputs.version }}
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      # A fresh checkout has no .env and so no app key, and the site's tests
      # (and some artisan commands) refuse to run without one. The files made
      # here are kept out of the commit.
      - name: Prepare the environment
        run: |
          set -euo pipefail
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then cp .env.example .env; else touch .env; fi
          fi
          if ! grep -qE '^APP_KEY=.+' .env; then
            # key:generate only replaces a line that is there.
            grep -q '^APP_KEY=' .env || printf '\nAPP_KEY=\n' >> .env
            php artisan key:generate --force --no-interaction
          fi
          printf '%s\n' '.env' '/node_modules' '/public/build' >> .git/info/exclude

      # The first package is the one whose version decides where the update
      # goes (gadya/cms by default).
      - name: The version before
        id: before
        run: |
          first=$(echo "$PACKAGES" | awk '{print $1}')
          echo "package=${first}" >> "$GITHUB_OUTPUT"
          echo "version=$(composer show "$first" --format=json 2>/dev/null | jq -r '.versions[0] // empty' | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      # Dev tools the site's own composer scripts call (Laravel Boost, say)
      # only load in a local environment, so the update runs as one. Only this
      # step and the upgrade steps: the tests keep the environment the site's
      # phpunit.xml gives them.
      - name: Update
        env:
          PACKAGE: ${{ steps.before.outputs.package }}
          APP_ENV: local
          APP_DEBUG: 'true'
        run: |
          set -euo pipefail
          if [ -n "$CONSTRAINT" ]; then
            composer require "${PACKAGE}:${CONSTRAINT}" -W --no-interaction --no-progress
          fi
          # Word splitting is wanted here: one argument per package.
          # shellcheck disable=SC2086
          if ! composer update $PACKAGES -W --no-interaction --no-progress; then
            # A site's own post-update script can fail after the packages and
            # the lock are already updated. Resolving again without scripts
            # succeeds if that is all it was, and fails for a real conflict.
            echo "::warning::A composer script failed after the update; carrying on without scripts."
            # shellcheck disable=SC2086
            composer update $PACKAGES -W --no-interaction --no-progress --no-scripts
            php artisan package:discover --ansi || true
          fi

      - name: The version after
        id: after
        env:
          PACKAGE: ${{ steps.before.outputs.package }}
        run: echo "version=$(composer show "$PACKAGE" --format=json 2>/dev/null | jq -r '.versions[0] // empty' | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      # gadya:upgrade --phase=code comes with gadya/connect 0.6. A site on an
      # older connect gets what this workflow did before it existed.
      - name: Upgrade steps
        id: upgrade
        continue-on-error: true
        env:
          APP_ENV: local
          APP_DEBUG: 'true'
        run: |
          set -uo pipefail
          if php artisan help gadya:upgrade --no-interaction > /dev/null 2>&1; then
            php artisan gadya:upgrade --phase=code --json --no-interaction > "$RUNNER_TEMP/gadya-upgrade.json"
            status=$?
            cat "$RUNNER_TEMP/gadya-upgrade.json"
            exit $status
          fi
          echo "This site's gadya/connect has no gadya:upgrade yet; running the steps it used to."
          php artisan migrate --force --no-interaction || true
          php artisan filament:assets --no-interaction || true

      - name: Stop when nothing changed
        id: changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The tests draw real pages, and a page that asks for its stylesheet
      # fails without the built assets.
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.changed == 'true' && hashFiles('package-lock.json') != ''
        with:
          node-version: 22
          cache: npm

      - name: Build the assets
        if: steps.changed.outputs.changed == 'true' && hashFiles('package-lock.json') != ''
        run: |
          npm ci
          npm run build --if-present

      - name: Tests
        id: tests
        if: steps.changed.outputs.changed == 'true'
        continue-on-error: true
        run: php artisan test

      # patch: the same major and minor. minor: the same major, so on 0.x any
      # 0.x release. never: always a pull request. Straight in only when the
      # tests and the upgrade steps passed.
      - name: Decide where this goes
        id: route
        if: steps.changed.outputs.changed == 'true'
        env:
          PACKAGE: ${{ steps.before.outputs.package }}
          BEFORE: ${{ steps.before.outputs.version }}
          AFTER: ${{ steps.after.outputs.version }}
          TESTS: ${{ steps.tests.outcome }}
          UPGRADE: ${{ steps.upgrade.outcome }}
        run: |
          set -euo pipefail
          policy="${MERGE:-patch}"
          if [ "$ALWAYS_PULL_REQUEST" = "true" ]; then
            policy="never"
          fi
          within=false
          if [ -n "$BEFORE" ] && [ -n "$AFTER" ]; then
            case "$policy" in
              patch) [ "$(echo "$BEFORE" | cut -d. -f1,2)" = "$(echo "$AFTER" | cut -d. -f1,2)" ] && within=true ;;
              minor) [ "$(echo "$BEFORE" | cut -d. -f1)" = "$(echo "$AFTER" | cut -d. -f1)" ] && within=true ;;
            esac
          fi
          if [ "$TESTS" = "success" ] && [ "$UPGRADE" = "success" ] && [ "$within" = "true" ]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
          fi
          echo "title=chore: ${PACKAGE} ${BEFORE:-none} → ${AFTER:-none}" >> "$GITHUB_OUTPUT"

      # The last line of the commit message (and the pull request) is for the
      # portal to read:
      #   Gadya-Update: before=0.14.8 after=0.15.0 tests=success merged=true rollout=12
      - name: Commit, then push or open a pull request
        id: publish
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.before.outputs.package }}
          BEFORE: ${{ steps.before.outputs.version }}
          AFTER: ${{ steps.after.outputs.version }}
          TESTS: ${{ steps.tests.outcome }}
          UPGRADE: ${{ steps.upgrade.outcome }}
          TITLE: ${{ steps.route.outputs.title }}
          MERGE_DECISION: ${{ steps.route.outputs.merge }}
        run: |
          set -euo pipefail
          tests=$([ "$TESTS" = "success" ] && echo success || echo failure)
          trailer() { echo "Gadya-Update: before=${BEFORE:-none} after=${AFTER:-none} tests=${tests} merged=$1 rollout=${ROLLOUT_ID}"; }
          body="Updated from the Gadya Media portal. Tests: ${tests}. Upgrade steps: ${UPGRADE}."

          git config user.name "Gadya Media"
          git config user.email "bot@gadya.media"
          git add -A

          if [ "$MERGE_DECISION" = "true" ]; then
            git commit -q -m "$TITLE" -m "$body" -m "$(trailer true)"
            if git push origin "HEAD:${BRANCH}"; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              echo "trailer=$(trailer true)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "${BRANCH} moved on while this ran; opening a pull request instead."
            git commit -q --amend -m "$TITLE" -m "$body" -m "$(trailer false)"
          else
            git commit -q -m "$TITLE" -m "$body" -m "$(trailer false)"
          fi

          # The branch is named for the rollout, so the portal can find it
          # even when this run cannot open the pull request itself.
          head="chore/gadya-update-${ROLLOUT_ID:-$(date +%Y%m%d%H%M%S)}"
          git push --force origin "HEAD:${head}"
          echo "merged=false" >> "$GITHUB_OUTPUT"
          echo "branch=${head}" >> "$GITHUB_OUTPUT"
          echo "trailer=$(trailer false)" >> "$GITHUB_OUTPUT"

          # GitHub lets a repository (or its organisation) forbid Actions from
          # opening pull requests. That must not lose the update: the branch is
          # pushed, and the portal opens the pull request with its own token.
          if url=$(gh pr create --head "$head" --base "$BRANCH" --title "$TITLE" \
            --body "$(printf '%s\n\n- %s %s → %s\n- Tests: %s\n- Upgrade steps: %s\n\nRead `vendor/gadya/cms/CHANGELOG.md` for what changed, and `docs/upgrading.md` for anything a release asks of you.\n\n%s' \
              "Updated from the Gadya Media portal." "$PACKAGE" "${BEFORE:-none}" "${AFTER:-none}" "$tests" "$UPGRADE" "$(trailer false)")" 2>"$RUNNER_TEMP/gh-pr.err"); then
            echo "pull_request=${url}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not open the pull request here ($(tr '\n' ' ' < "$RUNNER_TEMP/gh-pr.err")). The branch ${head} is pushed; the Gadya Media portal opens the pull request."
          fi

      - name: Summary
        if: always()
        env:
          BEFORE: ${{ steps.before.outputs.version }}
          AFTER: ${{ steps.after.outputs.version }}
          CHANGED: ${{ steps.changed.outputs.changed }}
          TESTS: ${{ steps.tests.outcome }}
          TRAILER: ${{ steps.publish.outputs.trailer }}
          PULL_REQUEST: ${{ steps.publish.outputs.pull_request }}
          PUSHED_BRANCH: ${{ steps.publish.outputs.branch }}
        run: |
          if [ -z "$TRAILER" ]; then
            # Nothing was committed: nothing changed, or it stopped before the commit.
            if [ "$CHANGED" = "false" ]; then tests=skipped; elif [ "$TESTS" = "success" ]; then tests=success; else tests=failure; fi
            TRAILER="Gadya-Update: before=${BEFORE:-none} after=${AFTER:-none} tests=${tests} merged=false rollout=${ROLLOUT_ID}"
          fi
          {
            echo "## Gadya update"
            echo
            if [ "$CHANGED" = "false" ]; then
              echo "Already up to date: nothing to commit."
            elif [ -n "$PULL_REQUEST" ]; then
              echo "Waiting in a pull request: ${PULL_REQUEST}"
            elif [ -n "$PUSHED_BRANCH" ]; then
              echo "Waiting on the branch ${PUSHED_BRANCH}: the portal opens the pull request."
            fi
            if [ -s "$RUNNER_TEMP/gadya-upgrade.json" ]; then
              echo
              echo "Upgrade steps run: $(jq -r '[.ran[].key] | join(", ") | if . == "" then "none" else . end' "$RUNNER_TEMP/gadya-upgrade.json" 2>/dev/null)"
              echo "Upgrade steps failed: $(jq -r '[.failed[] | "\(.key) (\(.error))"] | join(", ") | if . == "" then "none" else . end' "$RUNNER_TEMP/gadya-upgrade.json" 2>/dev/null)"
            fi
            echo
            echo "$TRAILER"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the run when the tests or the upgrade steps failed
        if: steps.changed.outputs.changed == 'true' && (steps.tests.outcome != 'success' || steps.upgrade.outcome != 'success')
        run: |
          echo "The update is waiting for a person (a pull request, or its branch): the tests or the upgrade steps failed."
          exit 1
